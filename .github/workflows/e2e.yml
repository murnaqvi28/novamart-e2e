name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # every day at 08:00 Pakistan time
  workflow_dispatch:
    inputs:
      suite:
        description: Which tests to run
        type: choice
        default: all
        options: [all, smoke, api, ui, mobile]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://novamart-ot9u.onrender.com' }}
      TEST_RESET_KEY: ${{ secrets.TEST_RESET_KEY }}
      SUITE: ${{ github.event.inputs.suite || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests (${{ env.SUITE }})
        run: |
          case "$SUITE" in
            smoke)  npx playwright test --grep @smoke ;;
            api)    npx playwright test --project=api ;;
            ui)     npx playwright test --project=chromium ;;
            mobile) npx playwright test --project=mobile ;;
            *)      npx playwright test ;;
          esac

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
